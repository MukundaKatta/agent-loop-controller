[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-loop-controller"
version = "0.1.0"
description = "Control agent loops with step limits, pause/resume, and abort signals"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["agent", "loop", "control", "pause", "abort", "step-limit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/MukundaKatta/agent-loop-controller"
Repository = "https://github.com/MukundaKatta/agent-loop-controller"
Issues = "https://github.com/MukundaKatta/agent-loop-controller/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_loop_controller = ["py.typed"]
